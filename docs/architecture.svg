<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b82"/></marker>
    <style>
      .box{fill:#fff;stroke:#c3cddb;stroke-width:1.5}
      .hd{font-size:15px;font-weight:700;fill:#16202e}
      .tx{font-size:12.5px;fill:#4a5568}
      .lbl{font-size:12px;fill:#5b6b82;font-weight:600;letter-spacing:.06em}
      .ln{stroke:#5b6b82;stroke-width:1.6;fill:none}
      .el{font-size:11.5px;fill:#5b6b82}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f4f6f9"/>
  <text x="40" y="46" font-size="24" font-weight="800" fill="#1d3a6e">Pravi — R&amp;B Asset Lifecycle Tracker · System architecture</text>
  <text x="40" y="72" font-size="14" fill="#4a5568">One Docker service: FastAPI serves the REST API and the built React app; every asset has one lifelong record built from contracts, inspections and citizen reports.</text>

  <!-- column labels -->
  <text x="40" y="112" class="lbl">USERS</text>
  <text x="330" y="112" class="lbl">FRONTEND · React + TypeScript (Vite)</text>
  <text x="660" y="112" class="lbl">BACKEND · FastAPI (Python)</text>
  <text x="1080" y="112" class="lbl">DATA &amp; EXTERNAL SERVICES</text>

  <!-- users -->
  <g><rect x="40" y="128" width="240" height="96" rx="10" class="box"/>
    <text x="58" y="156" class="hd">Citizen (any phone)</text>
    <text x="58" y="178" class="tx">No login · EN / ગુજરાતી / हिंदी</text>
    <text x="58" y="197" class="tx">Pin problem + photo → ticket</text>
    <text x="58" y="216" class="tx">Confirms “fixed / not fixed”</text></g>
  <g><rect x="40" y="244" width="240" height="96" rx="10" class="box"/>
    <text x="58" y="272" class="hd">Deputy Engineer (phone)</text>
    <text x="58" y="294" class="tx">Verify complaints, inspections</text>
    <text x="58" y="313" class="tx">Upload tender / work order /</text>
    <text x="58" y="332" class="tx">completion PDFs</text></g>
  <g><rect x="40" y="360" width="240" height="96" rx="10" class="box"/>
    <text x="58" y="388" class="hd">Executive Engineer</text>
    <text x="58" y="410" class="tx">Sanction works, act on flags,</text>
    <text x="58" y="429" class="tx">budget plan, weights</text>
    <text x="58" y="448" class="tx">(JWT role: ee)</text></g>
  <g><rect x="40" y="476" width="240" height="78" rx="10" class="box"/>
    <text x="58" y="504" class="hd">Auditor (read-only)</text>
    <text x="58" y="526" class="tx">Timelines, flags, ₹ at risk,</text>
    <text x="58" y="545" class="tx">contractor scorecard</text></g>

  <!-- web app -->
  <g><rect x="330" y="128" width="270" height="130" rx="10" class="box"/>
    <text x="348" y="156" class="hd">Public pages</text>
    <text x="348" y="178" class="tx">/report — map pin, issue icons, photo</text>
    <text x="348" y="197" class="tx">/track — status steps + confirm</text>
    <text x="348" y="216" class="tx">Mobile-first, works on low-end phones</text>
    <text x="348" y="235" class="tx">React-Leaflet + OpenStreetMap</text></g>
  <g><rect x="330" y="278" width="270" height="276" rx="10" class="box"/>
    <text x="348" y="306" class="hd">Staff pages (login)</text>
    <text x="348" y="330" class="tx">Dashboard — priority map, flags, ₹ at risk</text>
    <text x="348" y="352" class="tx">Asset page — lifelong timeline,</text>
    <text x="348" y="370" class="tx">   liability badge, priority breakdown</text>
    <text x="348" y="392" class="tx">Complaints — verify → assign → fix</text>
    <text x="348" y="414" class="tx">Works — proposal → completion board</text>
    <text x="348" y="436" class="tx">Documents — upload / URL import,</text>
    <text x="348" y="454" class="tx">   review extracted fields, confirm</text>
    <text x="348" y="476" class="tx">Budget planner · Contractors</text>
    <text x="348" y="498" class="tx">Settings — weights, LLM test (all role-aware)</text>
    <text x="348" y="530" class="tx" font-style="italic">React Router · TanStack Query · Tailwind</text></g>

  <!-- backend -->
  <g><rect x="660" y="128" width="360" height="62" rx="10" class="box"/>
    <text x="678" y="154" class="hd">Auth</text>
    <text x="678" y="176" class="tx">bcrypt passwords · JWT in httpOnly cookie · role + district</text></g>
  <g><rect x="660" y="204" width="360" height="80" rx="10" class="box"/>
    <text x="678" y="230" class="hd">Complaint service</text>
    <text x="678" y="252" class="tx">GPS → nearest road section + km (snap) · merge</text>
    <text x="678" y="271" class="tx">duplicates ≤300 m · liability check · rate limit</text></g>
  <g><rect x="660" y="298" width="360" height="98" rx="10" fill="#fff4e0" stroke="#e8870e" stroke-width="2"/>
    <text x="678" y="324" class="hd">Document reader</text>
    <text x="678" y="346" class="tx">pdfplumber text → Gujarat rules (Form B-1, Clause</text>
    <text x="678" y="365" class="tx">17-A, “Km. 4/0 to 8/0”) + optional open-source LLM</text>
    <text x="678" y="384" class="tx">→ match road by name / taluka / km → update lifecycle</text></g>
  <g><rect x="660" y="410" width="360" height="98" rx="10" fill="#e7f0fd" stroke="#1f5fbf" stroke-width="2"/>
    <text x="678" y="436" class="hd">Rules engine</text>
    <text x="678" y="458" class="tx">Liability windows (km-range aware, superseding)</text>
    <text x="678" y="477" class="tx">10 risk flags · priority score 0–100 (weights)</text>
    <text x="678" y="496" class="tx">Contractor scorecard</text></g>
  <g><rect x="660" y="522" width="360" height="80" rx="10" class="box"/>
    <text x="678" y="548" class="hd">Budget planner</text>
    <text x="678" y="570" class="tx">Free fixes → safety → value per ₹ (people × need)</text>
    <text x="678" y="589" class="tx">+ rural reserve for village roads</text></g>

  <!-- data & external -->
  <g><rect x="1080" y="128" width="280" height="190" rx="10" class="box"/>
    <text x="1098" y="156" class="hd">Postgres (Neon) · SQLite locally</text>
    <text x="1098" y="180" class="tx">asset — road section / bridge /</text>
    <text x="1098" y="198" class="tx">   culvert / building (+ JSON attrs)</text>
    <text x="1098" y="220" class="tx">work · document · inspection</text>
    <text x="1098" y="242" class="tx">complaint · photo (compressed)</text>
    <text x="1098" y="264" class="tx">event — append-only history</text>
    <text x="1098" y="290" class="tx" font-style="italic">district on every row → partition</text>
    <text x="1098" y="306" class="tx" font-style="italic">by district to scale statewide</text></g>
  <g><rect x="1080" y="338" width="280" height="98" rx="10" class="box"/>
    <text x="1098" y="364" class="hd">Open-source LLM (optional)</text>
    <text x="1098" y="386" class="tx">Qwen via OpenRouter, or Ollama /</text>
    <text x="1098" y="405" class="tx">vLLM on a state server (data stays</text>
    <text x="1098" y="424" class="tx">in India) · rules fallback always on</text></g>
  <g><rect x="1080" y="456" width="280" height="62" rx="10" class="box"/>
    <text x="1098" y="482" class="hd">Public tender PDFs</text>
    <text x="1098" y="504" class="tx">nprocure / R&amp;B site → URL import</text></g>
  <g><rect x="1080" y="532" width="280" height="62" rx="10" class="box"/>
    <text x="1098" y="558" class="hd">OpenStreetMap tiles</text>
    <text x="1098" y="580" class="tx">road geometry drawn per section</text></g>

  <!-- arrows users -> web -->
  <path class="ln" d="M280 176H330" marker-end="url(#a)"/>
  <path class="ln" d="M280 292H305V330H330" marker-end="url(#a)"/>
  <path class="ln" d="M280 408H330" marker-end="url(#a)"/>
  <path class="ln" d="M280 515H330" marker-end="url(#a)"/>
  <!-- web -> backend -->
  <path class="ln" d="M600 193H630V159H660" marker-end="url(#a)"/>
  
  <path class="ln" d="M600 416H630V244H660" marker-end="url(#a)"/>
  <path class="ln" d="M630 347H660" marker-end="url(#a)"/>
  <path class="ln" d="M630 459H660" marker-end="url(#a)"/>
  <path class="ln" d="M630 416V562H660" marker-end="url(#a)"/>
  
  <!-- backend -> data -->
  <path class="ln" d="M1020 244H1050V222H1080" marker-end="url(#a)"/>
  <path class="ln" d="M1020 459H1050V222" />
  <path class="ln" d="M1020 347H1080 M1050 347V387H1080" marker-end="url(#a)"/>
  <path class="ln" d="M1050 387V487H1080" marker-end="url(#a)"/>

  <!-- lifecycle strip -->
  <rect x="40" y="636" width="1320" height="190" rx="12" fill="#fff" stroke="#c3cddb" stroke-width="1.5"/>
  <text x="60" y="666" class="hd">Lifecycle of every asset (each step is an event on its timeline)</text>
  <g font-size="12.5" fill="#16202e">
    <rect x="60" y="686" width="120" height="40" rx="8" fill="#eef1f6"/><text x="120" y="711" text-anchor="middle">Proposed</text>
    <rect x="198" y="686" width="120" height="40" rx="8" fill="#eef1f6"/><text x="258" y="711" text-anchor="middle">Sanctioned</text>
    <rect x="336" y="686" width="120" height="40" rx="8" fill="#eef1f6"/><text x="396" y="711" text-anchor="middle">Tendered</text>
    <rect x="474" y="686" width="120" height="40" rx="8" fill="#eef1f6"/><text x="534" y="711" text-anchor="middle">Awarded</text>
    <rect x="612" y="686" width="140" height="40" rx="8" fill="#eef1f6"/><text x="682" y="711" text-anchor="middle">Under construction</text>
    <rect x="770" y="686" width="120" height="40" rx="8" fill="#e3f6ec"/><text x="830" y="711" text-anchor="middle">Completed</text>
    <rect x="908" y="686" width="160" height="40" rx="8" fill="#e7f0fd" stroke="#1f5fbf"/><text x="988" y="711" text-anchor="middle" font-weight="700">Under liability (17-A)</text>
    <rect x="1086" y="686" width="120" height="40" rx="8" fill="#eef1f6"/><text x="1146" y="711" text-anchor="middle">In service</text>
    <rect x="1224" y="686" width="120" height="40" rx="8" fill="#fff4e0"/><text x="1284" y="711" text-anchor="middle">Issue reported</text>
  </g>
  <g class="ln"><path d="M180 706H198" marker-end="url(#a)"/><path d="M318 706H336" marker-end="url(#a)"/><path d="M456 706H474" marker-end="url(#a)"/>
    <path d="M594 706H612" marker-end="url(#a)"/><path d="M752 706H770" marker-end="url(#a)"/><path d="M890 706H908" marker-end="url(#a)"/>
    <path d="M1068 706H1086" marker-end="url(#a)"/><path d="M1206 706H1224" marker-end="url(#a)"/></g>
  <path class="ln" d="M1284 726V790H988V726" marker-end="url(#a)"/>
  <text x="1274" y="782" class="tx" text-anchor="end">still liable → contractor fixes at ₹0 (15-day defect notice)</text>
  <path class="ln" d="M1284 790V806H120V726" marker-end="url(#a)"/>
  <text x="130" y="800" class="tx">out of liability → new repair work (paid) · major rehab starts a new cycle · citizen confirms every fix</text>
</svg>
